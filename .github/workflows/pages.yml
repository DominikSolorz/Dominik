name: Publikuj DS MAIL na GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ds-mail-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz DS MAIL z gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Przygotuj pliki DS MAIL
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Opublikuj DS MAIL
        id: deployment
        uses: actions/deploy-pages@v4
